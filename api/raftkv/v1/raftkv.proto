syntax = "proto3";

package raftkv.v1;

option go_package = "github.com/yourusername/raftkv/api/raftkv/v1;raftkvv1";

service RaftPeer {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(InstallSnapshotRequest) returns (InstallSnapshotResponse);
}

service KeyValue {
  rpc Put(PutRequest) returns (ClientResponse);
  rpc Get(GetRequest) returns (ClientResponse);
  rpc Delete(DeleteRequest) returns (ClientResponse);
}

enum Operation {
  OPERATION_UNSPECIFIED = 0;
  OPERATION_NOOP = 1;
  OPERATION_PUT = 2;
  OPERATION_DELETE = 3;
  OPERATION_GET = 4;
}

enum ClientStatus {
  CLIENT_STATUS_UNSPECIFIED = 0;
  CLIENT_STATUS_OK = 1;
  CLIENT_STATUS_NOT_LEADER = 2;
  CLIENT_STATUS_FAILED = 3;
}

message Command {
  Operation operation = 1;
  string client_id = 2;
  uint64 sequence = 3;
  string key = 4;
  string value = 5;
}

message LogEntry {
  uint64 index = 1;
  uint64 term = 2;
  Command command = 3;
}

message RequestVoteRequest {
  uint64 term = 1;
  string candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
  uint64 election = 5;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
  uint64 election = 3;
}

message AppendEntriesRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  uint64 request_id = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 conflict_index = 4;
  uint64 conflict_term = 5;
  uint64 request_id = 6;
}

message InstallSnapshotRequest {
  uint64 term = 1;
  string leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  bytes data = 5;
  uint64 request_id = 6;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
  uint64 match_index = 3;
  uint64 request_id = 4;
}

message PutRequest {
  string client_id = 1;
  uint64 sequence = 2;
  string key = 3;
  string value = 4;
}

message GetRequest {
  string client_id = 1;
  uint64 sequence = 2;
  string key = 3;
}

message DeleteRequest {
  string client_id = 1;
  uint64 sequence = 2;
  string key = 3;
}

message ClientResponse {
  ClientStatus status = 1;
  string value = 2;
  bool found = 3;
  string error = 4;
  string leader_hint = 5;
  string node_id = 6;
  uint64 term = 7;
}
